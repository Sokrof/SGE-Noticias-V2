<ion-app>
  <ion-menu side="end"
            menuId="main-menu"
            contentId="main"
            type="overlay"
            [swipeGesture]="true">
    <ion-header>
      <ion-toolbar>
        <ion-title class="ion-text-center">
          <ion-avatar class="header-avatar" style="margin: auto; width: 60px; height: 60px;">
            <ion-img src="assets/newsLogo.png" alt="Logo"></ion-img>
          </ion-avatar>
        </ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-menu-toggle auto-hide="true">
          <!-- Inicio -->
          <ion-item button (click)="goHome()" class="category-item">
            <ion-avatar slot="start">
               <ion-icon name="home" style="font-size: 24px; color: var(--ion-color-secondary);"></ion-icon>
            </ion-avatar>
            <ion-label>INICIO</ion-label>
          </ion-item>

          <!-- Secciones dinámicas -->
          <ion-item *ngFor="let category of categories"
                    (click)="selectCategory(category.name)"
                    button
                    class="category-item">
            <ion-avatar slot="start">
              <ion-img [src]="category.icon" [alt]="category.name"></ion-img>
            </ion-avatar>
            <ion-label>{{ category.name | uppercase }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
