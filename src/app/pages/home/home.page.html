<ion-header>
  <ion-toolbar>
    <ion-title class="home-title">INICIO</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-title class="home-logo-title">
      <ion-avatar class="home-logo">
        <ion-img src="assets/logo.jpg" alt="Logo"></ion-img>
      </ion-avatar>
    </ion-title>
    <ion-buttons slot="end">
      <ion-menu-button menu="main-menu"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    @for (noticia of noticias; track $index) {
      <ion-card (click)="goToNoticiasDetail(noticia._id)">
        <ion-card-content>
          <div class="card-content">
            <ion-img class="news-image" [src]="noticia.images" alt="Imagen de {{noticia.title}}"></ion-img>
            <div class="card-details">
              <ion-card-title class="ion-text-capitalize">
                {{ noticia.title }}
              </ion-card-title>
              <p class="news-author">
                <b>Autor:</b> {{ noticia.author }}
              </p>
            </div>
          </div>
        </ion-card-content>
      </ion-card>
    }
  </ion-list>

  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Cargando más noticias...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
